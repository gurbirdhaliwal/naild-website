name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm run test

      - run: npm run build
        env:
          NEXT_PUBLIC_API_BASE: https://api.example.com/api/v1
          NEXT_PUBLIC_API_ORIGIN: https://api.example.com
          NEXT_PUBLIC_AI_BASE: https://ai.example.com

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: python -m pip install --upgrade pip requests

      - run: python -m py_compile python_backend/main.py

      - run: python -m compileall python_backend

      - run: python -m unittest discover -s python_backend/tests
